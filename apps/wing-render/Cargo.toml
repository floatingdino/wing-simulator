[package]
name = "wing-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wing_render"
path = "src/lib.rs"

[[bin]]
name = "wing-render"
path = "src/main.rs"

[[bin]]
name = "wing-verify"
path = "src/bin/wing-verify.rs"

[dependencies]
serde_json.workspace = true
wing-model = { path = "../../crates/wing-model" }
wing-engine = { path = "../../crates/wing-engine" }
wing-blocks = { path = "../../crates/wing-blocks" }
wing-sim = { path = "../wing-sim" }

[dev-dependencies]
criterion.workspace = true
wing-shm = { path = "../../crates/wing-shm" }
wing-hostio = { path = "../../crates/wing-hostio" }

[[bench]]
name = "perf"
harness = false
