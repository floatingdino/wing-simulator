[workspace]
resolver = "2"
members = [
    "crates/wing-proto",
    "crates/wing-model",
    "crates/wing-dsp",
    "crates/wing-blocks",
    "crates/wing-engine",
    "crates/wing-shm",
    "crates/wing-hostio",
    "apps/wing-sim",
    "apps/wing-render",
    "apps/wing-diff",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
libc = "0.2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
socket2 = { version = "0.6", features = ["all"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

# The drift simulation tests run an hour of audio; keep them fast in `cargo test`.
[profile.dev.package.wing-hostio]
opt-level = 2

# wing-blocks fidelity tests are far too slow unoptimised (T062)
[profile.dev.package.wing-blocks]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
